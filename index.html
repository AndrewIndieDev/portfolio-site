<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andrew Dowsett</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.andrewdowsett.dev/">
  <meta property="og:title" content="Andrew Dowsett - Interactive Portfolio">
  <meta property="og:description" content="Unity Developer / Game Designer">
  <meta property="og:image" content="https://www.andrewdowsett.dev/images/profile-photo.png">
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://www.andrewdowsett.dev/">
  <meta property="twitter:title" content="Andrew Dowsett - Interactive Portfolio">
  <meta property="twitter:description" content="Unity Developer / Game Designer">
  <meta property="twitter:image" content="https://www.andrewdowsett.dev/images/profile-photo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260815j">
</head>
<body>
  <div id="backgroundStage" class="background-stage" aria-label="Interactive project stage">
    <video id="backgroundPreview" class="background-preview" muted loop playsinline></video>
    <iframe id="backgroundGame" class="background-game" title="Playable web game" allow="autoplay; fullscreen; gamepad" allowfullscreen hidden></iframe>
    <div class="stage-vignette" aria-hidden="true"></div>
    <div class="stage-label" aria-live="polite">
      <span id="stageMode" class="stage-mode">Background preview</span>
      <strong id="stageTitle">Loading portfolio…</strong>
    </div>
  </div>
  <div class="hud-controls" aria-label="HUD controls">
    <button id="hudToggle" class="hud-control" type="button" aria-expanded="true">Retract HUD</button>
    <button id="exitGame" class="hud-control hud-control--danger" type="button" hidden>Exit game</button>
  </div>
  <header class="mobile-topbar" aria-label="Mobile navigation">
    <div class="mobile-brand">
      <span class="mobile-brand-name">Andrew Dowsett</span>
    </div>
    <button id="mobileMenuToggle" class="mobile-menu-toggle" type="button" aria-expanded="false" aria-controls="navRail" aria-label="Open navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>
  <div id="mobileNavScrim" class="mobile-nav-scrim" hidden></div>
  <div id="app" class="app-shell">
    <aside id="navRail" class="nav-rail" aria-label="Primary"></aside>
    <main id="contentArea" class="content-area" aria-label="Portfolio content">
      <div id="contentViewport" class="content-viewport"></div>
    </main>
  </div>
  <script src="app.js?v=20260815h" defer></script>
</body>
</html>
